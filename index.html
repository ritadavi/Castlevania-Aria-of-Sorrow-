<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania GBA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #ff3333;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 4px solid #333333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        #game-container {
            width: 100%;
            aspect-ratio: 4 / 3; 
            background-color: #000;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #status-message {
            margin-top: 15px;
            font-size: 10px;
            color: #ff9999;
            text-align: center;
        }
        @media (max-width: 840px) {
            h1 {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>
    
    <div id="status-message"></div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Castlevania';
        EJS_color = '#800000';
        EJS_startOnLoaded = false;
        
        // CDN v4 via unpkg (resolve problemas de GamepadHandler e erros de rede)
        EJS_pathtodata = 'https://unpkg.com/emulatorjs@4.0.0/data/';
        
        // Caminho relativo para a ROM
        EJS_gameUrl = 'castlevania.gba'; 
        
        // Define idioma padrão sem tentar buscar arquivos de tradução ausentes
        EJS_language = 'en-US';
    </script>
    
    <!-- Script de carregamento v4 -->
    <script src="https://unpkg.com/emulatorjs@4.0.0/data/loader.js"></script>

    <script>
        // Verificação de conexão com o arquivo da ROM
        fetch('castlevania.gba', { method: 'HEAD' })
            .then(response => {
                if (!response.ok) {
                    document.getElementById('status-message').innerText = 
                        "ERRO: O arquivo 'castlevania.gba' não foi encontrado no servidor (404).";
                }
            })
            .catch(error => {
                document.getElementById('status-message').innerText = 
                    "ERRO DE REDE/CORS: Se estiver rodando offline sem um servidor local, o navegador bloqueia a ROM.";
            });
    </script>

</body>
</html>
