<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania: Aria of Sorrow GBA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1a0000 25%, #330000 50%, #1a0000 75%);
            background-size: 400% 400%;
            animation: gothic 12s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            color: #ff3333;
            text-shadow: 2px 2px 0px #000000, 4px 4px 0px #4d0000;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
            letter-spacing: 1px;
        }

        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 4px solid #800000;
            box-shadow: 0 0 25px rgba(128, 0, 0, 0.6);
        }

        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 2px solid #333333;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        @keyframes gothic {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA: ARIA OF SORROW</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Configurações do EmulatorJS para Game Boy Advance -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba'; // Núcleo do GBA
        EJS_gameName = 'Castlevania Aria of Sorrow';
        EJS_color = '#800000'; // Vermelho escuro/gótico
        EJS_startOnLoaded = false;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        
        // Nome simplificado do arquivo no GitHub
        EJS_gameUrl = 'castlevania-aria-of-sorrow.gba';

        EJS_cacheUrl = true;
        EJS_defaultSettings = {
            'save-state-location': 'browser'
        };
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
