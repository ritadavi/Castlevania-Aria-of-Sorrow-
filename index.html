<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania GBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #ff3333;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 4px solid #333333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        #game-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #status-message {
            margin-top: 15px;
            font-size: 10px;
            color: #ff9999;
            text-align: center;
            line-height: 1.6;
        }
        @media (max-width: 840px) {
            h1 {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <div id="status-message">Carregando emulador...</div>

    <script type="text/javascript">
        // Configurações obrigatórias do EmulatorJS
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Castlevania';
        EJS_color = '#800000';
        EJS_startOnLoaded = true;
        
        // Caminho oficial da CDN estável do EmulatorJS
        EJS_pathtodata = 'https://emulatorjs.org';
        
        // Caminho da sua ROM (deve estar na mesma pasta do HTML)
        EJS_gameUrl = 'castlevania.gba'; 
    </script>

    <!-- Script de carregamento oficial atualizado -->
    <script src="https://emulatorjs.orgloader.js"></script>

    <script>
        // Sistema de diagnóstico para ajudar você a testar
        const statusDiv = document.getElementById('status-message');

        if (window.location.protocol === 'file:') {
            statusDiv.innerHTML = "ERRO DE SISTEMA: Você abriu o arquivo clicando duas vezes.<br>" +
                                  "Navegadores bloqueiam jogos (CORS) localmente.<br>" +
                                  "<strong>Você PRECISA usar um servidor local (Ex: Live Server do VS Code).</strong>";
        } else {
            fetch('castlevania.gba', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        statusDiv.innerText = "Emulador pronto! Clique no botão de Play se necessário.";
                    } else {
                        statusDiv.innerHTML = "ERRO: O arquivo 'castlevania.gba' não foi encontrado.<br>" +
                                              "Certifique-se de que a ROM está na mesma pasta deste HTML com o nome exato.";
                    }
                })
                .catch(error => {
                    statusDiv.innerText = "Erro ao tentar ler o arquivo da ROM no servidor.";
                });
        }
    </script>
</body>
</html>
