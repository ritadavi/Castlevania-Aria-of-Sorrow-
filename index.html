<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA Player Online</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #111;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #ff3333;
            margin-bottom: 25px;
            text-align: center;
        }
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 4px solid #333;
        }
        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA GBA</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Castlevania';
        EJS_color = '#800000';
        EJS_startOnLoaded = true; // Inicia o carregamento automaticamente
        
        EJS_pathtodata = 'https://emulatorjs.org';
        
        // Atualizado para o nome exato do seu arquivo
        EJS_gameUrl = 'Castlevania.gba'; 
    </script>
    
    <script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
