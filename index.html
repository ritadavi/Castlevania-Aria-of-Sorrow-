<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania: Aria of Sorrow Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0202 25%, #2a0808 50%, #0f0202 75%);
            background-size: 400% 400%;
            animation: draculaFog 15s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            color: #ff3333;
            text-shadow: 3px 3px 0px #4a0000, 6px 6px 0px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 6px solid #ff3333;
            border-image: linear-gradient(to bottom, #ff3333, #550000) 1;
            box-shadow: 0 0 0 6px #000000, 0 20px 40px rgba(255, 0, 0, 0.3);
            image-rendering: pixelated;
        }

        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 4px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        .play-btn {
            position: absolute;
            z-index: 99;
            padding: 20px 40px;
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            color: #ffffff;
            background-color: #800000;
            border: 4px solid #ff3333;
            box-shadow: 0 6px 0 #4a0000, 0 10px 20px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .play-btn:hover {
            background-color: #a00000;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #4a0000, 0 12px 22px rgba(255, 0, 0, 0.4);
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a0000;
        }

        @keyframes draculaFog {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 14px;
            }
            .play-btn {
                font-size: 14px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA: ARIA OF SORROW</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <button id="start-btn" class="play-btn" onclick="startGame()">JOGAR</button>
            <div id="game"></div>
        </div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Castlevania: Aria of Sorrow';
        EJS_color = '#ff3333';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_gameUrl = 'castel.gba'; // Nome atualizado
        EJS_language = 'en-US';

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';

            const loader = document.createElement('script');
            loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(loader);
        }
    </script>

</body>
</html>
