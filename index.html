<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania GBA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #ff3333;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }
        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 4px solid #333333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        #game-container {
            width: 100%;
            aspect-ratio: 4 / 3; 
            background-color: #000;
            position: relative;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        @media (max-width: 840px) {
            h1 {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'gba';
        EJS_gameName = 'Castlevania';
        EJS_color = '#800000';
        EJS_startOnLoaded = false;
        
        // Uso da CDN jsDelivr para evitar bloqueios de rede
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/';
        
        // Nome exato da ROM
        EJS_gameUrl = 'castlevania.gba'; 
    </script>
    
    <!-- Loader via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/gh/emulatorjs/emulatorjs@latest/data/loader.js"></script>

</body>
</html>
