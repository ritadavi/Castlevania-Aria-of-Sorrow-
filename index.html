<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlevania GBA Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0202 25%, #2a0808 50%, #0f0202 75%);
            background-size: 400% 400%;
            animation: draculaFog 15s ease infinite;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            color: #ff3333;
            text-shadow: 3px 3px 0px #4a0000, 6px 6px 0px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
        }

        .game-wrapper {
            width: 800px;
            max-width: 100%;
            background-color: #000000;
            padding: 12px;
            border: 6px solid #ff3333;
            border-image: linear-gradient(to bottom, #ff3333, #550000) 1;
            box-shadow: 0 0 0 6px #000000, 0 20px 40px rgba(255, 0, 0, 0.3);
            image-rendering: pixelated;
        }

        #game-container {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            border: 4px solid #1a1a1a;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #status-log {
            margin-top: 15px;
            font-size: 10px;
            color: #ffaa00;
            text-align: center;
            max-width: 800px;
            line-height: 1.6;
        }

        @keyframes draculaFog {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 840px) {
            #game-container {
                height: 400px;
            }
            h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <h1>CASTLEVANIA ONLINE</h1>

    <div class="game-wrapper">
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <div id="status-log">Carregando verificador de ROM...</div>

    <script type="text/javascript">
        const romName = 'castlevania.gba';
        const statusElement = document.getElementById('status-log');

        // Teste de integridade do arquivo antes de ligar o emulador
        fetch(romName)
            .then(res => {
                if (!res.ok) throw new Error("Arquivo não encontrado no servidor.");
                return res.blob();
            })
            .then(blob => {
                const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
                
                if (blob.size === 0) {
                    statusElement.style.color = '#ff3333';
                    statusElement.innerText = "ERRO: O arquivo 'castlevania.gba' no servidor está com 0 MB (vazio). Faça o re-upload da ROM.";
                } else {
                    statusElement.style.color = '#66ff66';
                    statusElement.innerText = `ROM carregada (${sizeMB} MB). Iniciando jogo...`;
                    startEmulator();
                }
            })
            .catch(err => {
                statusElement.style.color = '#ff3333';
                statusElement.innerText = "ERRO: 'castlevania.gba' não foi encontrado na raiz do site ou você está abrindo o arquivo direto no PC sem servidor HTTP.";
            });

        function startEmulator() {
            EJS_player = '#game';
            EJS_core = 'gba';
            EJS_gameName = 'Castlevania';
            EJS_color = '#ff3333';
            EJS_startOnLoaded = true;
            EJS_pathtodata = 'https://unpkg.com/emulatorjs@4.0.0/data/';
            EJS_gameUrl = romName;
            EJS_language = 'en-US';

            const script = document.createElement('script');
            script.src = 'https://unpkg.com/emulatorjs@4.0.0/data/loader.js';
            document.body.appendChild(script);
        }
    </script>

</body>
</html>
